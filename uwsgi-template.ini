[uwsgi]
chdir = /home/network-api/api
; Only needed when dependencies are installed into a virtualenv instead of
; system packages (e.g. when session_util came from the apt repo).
; virtualenv = /home/network-api/api/.venv

; Run the vassal (workers + mule) unprivileged. Needed whenever the Emperor
; runs as root (the standard uwsgi-emperor package setup).
uid = network-api
gid = network-api

socket = network-api.wsgi
chmod-socket = 666
plugins = python3,logfile

; Loopback-only plain-HTTP listener for same-machine consumers (bypasses
; nginx entirely). Uncomment to enable, then call e.g.
;   curl http://127.0.0.1:8081/info
; Never bind this to a public interface.
; http-socket = 127.0.0.1:8081

; Master process: manages workers AND the price-fetcher mule.
; (Under uwsgi-emperor, vassals get a master implicitly — this line is
; explicit documentation and a no-op there.)
master = true

; Load the app in each worker AFTER fork, not once in the master pre-fork.
; Required: the app starts background threads (per-worker cache warmup) and
; uses threading locks — fork() kills auxiliary threads and freezes any lock
; they hold into the forked workers, deadlocking request paths.
lazy-apps = true

processes = 4
manage-script-name = true

mule = mule_price_fetcher.py

mount = /=wsgi:app

; Fail the vassal loudly at boot if the app cannot be imported
; (instead of serving 500s from a broken app).
need-app = true

; Kill any request stuck longer than 30s (upstream timeouts are 5s;
; chained cold-start fetches stay well under this). Guards against a
; hung upstream pinning all workers.
harakiri = 30

; Recycle workers periodically as a leak hedge.
max-requests = 100000
reload-on-rss = 512

listen = 128
vacuum = true

; Under uwsgi-emperor: config-file updates are applied via SIGHUP (graceful
; re-exec of the vassal master); file deletion stops the vassal via SIGTERM
; — die-on-term makes that a clean shutdown instead of a reload.
die-on-term = true

logger = file:logfile=/home/network-api/api.log,maxsize=100000000,backupname=/home/network-api/api.log.old
